seed: 20260901
# 相对路径按experiment.yaml的output_dir解析(见common.resolve_output_artifact)
source_predictions: qwen25_sft_b3_train/predictions.jsonl
sft_adapter: qwen2_5_7b_instruct/sft_lora_full_trajectory/final_adapter
output_subdir: dpo_lora
# B3在train分割已达93.8%动作正确率, 偏好对仅10条; accum=16+1epoch只有1个优化器步,
# DPO无法学习。改小累积步数并训3轮, 共15个优化器步, 使偏好优化真正有机会起作用。
num_train_epochs: 3
learning_rate: 0.000005
per_device_train_batch_size: 1
per_device_eval_batch_size: 1
gradient_accumulation_steps: 2
max_length: 4096
beta: 0.1
loss_type: sigmoid
logging_steps: 1
eval_steps: 5
save_steps: 5
warmup_ratio: 0.05
bf16: true
tf32: true
gradient_checkpointing: true
